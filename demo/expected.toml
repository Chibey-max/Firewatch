# What every demo node must show, from verified advisories only.
# scripts/verify-demo.py compares a live `firewatch check --json` with this.
# Status codes: affected | cant_tell | not_affected. A node missing from the
# live report is reported, except nodes marked optional.

[[node]]
name = "old-cln"
status = "affected"
build_check = "not_checked"
findings = { "FW-2026-003" = "affected", "FW-2026-006" = "affected" }
# After demo/upgrade.sh (scripts/verify-demo.py --after-upgrade):
after_upgrade = { status = "not_affected", findings = { "FW-2026-003" = "not_affected", "FW-2026-006" = "not_affected" } }

[[node]]
name = "current-cln"
status = "not_affected"
build_check = "not_checked"
findings = { "FW-2026-003" = "not_affected", "FW-2026-006" = "not_affected" }

[[node]]
name = "alice"
status = "affected"
build_check = "match"
findings = { "FW-2026-007" = "affected", "FW-2026-008" = "affected", "FW-2026-009" = "not_affected", "FW-2026-010" = "not_affected", "FW-2026-011" = "not_affected", "FW-2026-012" = "not_affected", "FW-2026-013" = "not_affected" }

[[node]]
name = "lnd-old"
status = "affected"
build_check = "match"
findings = { "FW-2026-007" = "not_affected", "FW-2026-008" = "affected", "FW-2026-009" = "not_affected", "FW-2026-010" = "not_affected", "FW-2026-011" = "not_affected", "FW-2026-012" = "affected", "FW-2026-013" = "cant_tell" }

# Built by demo/polar/Dockerfile.lnd-unofficial: official version number,
# unofficial commit, so every finding is Can't tell.
[[node]]
name = "lnd-unofficial"
optional = true
status = "cant_tell"
build_check = "mismatch"
findings = { "FW-2026-007" = "cant_tell", "FW-2026-008" = "cant_tell", "FW-2026-009" = "cant_tell", "FW-2026-010" = "cant_tell", "FW-2026-011" = "cant_tell", "FW-2026-012" = "cant_tell", "FW-2026-013" = "cant_tell" }
