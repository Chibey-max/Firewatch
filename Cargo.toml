[workspace]
resolver = "2"
members = ["crates/firewatch-core", "crates/firewatch-connectors", "crates/firewatch-alerts", "crates/firewatch-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs"] }
