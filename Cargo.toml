[workspace]
resolver = "2"
members = ["crates/firewatch-core", "crates/firewatch-connectors", "crates/firewatch-alerts", "crates/firewatch-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.1"
repository = "https://github.com/Chibey-max/Firewatch"
homepage = "https://github.com/Chibey-max/Firewatch"

[workspace.dependencies]
# Path plus version: the version is what crates.io resolves after publishing.
firewatch-alerts = { path = "crates/firewatch-alerts", version = "0.1.1" }
firewatch-connectors = { path = "crates/firewatch-connectors", version = "0.1.1" }
firewatch-core = { path = "crates/firewatch-core", version = "0.1.1" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
