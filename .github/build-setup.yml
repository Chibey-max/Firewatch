# Run by cargo-dist's release workflow before it builds `firewatch`: the
# binary embeds dashboard/dist (see crates/firewatch-cli/build.rs).
# cargo-dist drops `working-directory`, so each command cds itself.
- name: Install Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 22
    cache: npm
    cache-dependency-path: dashboard/package-lock.json
- name: Build the dashboard
  run: |
    cd dashboard
    npm ci
    npm run build
