# Copy to firewatch.toml (git-ignored) and fill in your nodes.
# Each rune must be restricted to getinfo, and to listconfigs for the four
# options Firewatch reads; Firewatch refuses any rune that can do more, and
# warns about one that can read every option. Create one on the node with:
#   lightning-cli createrune restrictions='[["method=getinfo","method=listconfigs"],["method/listconfigs","pnameconfig=clnrest-host","pnameconfig=clnrest-port","pnameconfig=grpc-host","pnameconfig=grpc-port"]]'

[[nodes]]
kind = "cln"
name = "old-cln"
url = "http://127.0.0.1:8182"   # clnrest; Polar maps it to a host port
rune = "<restricted rune>"

[[nodes]]
kind = "cln"
name = "current-cln"
url = "http://127.0.0.1:8183"
rune_file = "/path/to/current-cln.rune"

# LND: readonly.macaroon only; Firewatch refuses a macaroon that can write.
[[nodes]]
kind = "lnd"
name = "alice"
url = "https://127.0.0.1:8081"
macaroon_file = "/path/to/readonly.macaroon"
tls_cert = "/path/to/tls.cert"
# lnd_conf = "/path/to/lnd.conf"   # optional: check where LND's REST and gRPC listen;
#                                    # the file LND loads (its lnddir or --configfile)

[watch]
interval_secs = 10            # seconds between checks
listen = "127.0.0.1:7070"     # dashboard API; keep it on localhost
# dashboard_dir = "dashboard/dist"   # serve a built dashboard at /

# Private alerts: NIP-17 encrypted DMs to the operator's Nostr key.
[alerts.nostr]
recipient = "npub1..."                 # your key; alerts go only here
secret_key_file = "firewatch.nsec"     # Firewatch's own key, created on first run
relays = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net"]
