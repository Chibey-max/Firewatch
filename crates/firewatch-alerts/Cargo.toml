[package]
name = "firewatch-alerts"
description = "Private alerts for Firewatch (Nostr NIP-17 DMs)"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lightning", "bitcoin", "security", "lnd", "core-lightning"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
firewatch-core.workspace = true
nostr = { version = "0.45", features = ["std", "nip59", "os-rng"] }
nostr-sdk = { version = "0.45", default-features = false, features = ["aws_lc_rs", "rustls-tls-webpki-roots"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# A relay in the test process, to test delivery across a lost connection.
nostr-sdk = { version = "0.45", default-features = false, features = ["aws_lc_rs", "rustls-tls-webpki-roots", "local-relay"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio.workspace = true
