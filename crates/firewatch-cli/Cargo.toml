[package]
name = "firewatch-cli"
description = "The firewatch command-line tool"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "firewatch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
firewatch-alerts = { path = "../firewatch-alerts" }
firewatch-connectors = { path = "../firewatch-connectors" }
firewatch-core = { path = "../firewatch-core" }
futures.workspace = true
reqwest = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
