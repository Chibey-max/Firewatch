[package]
name = "firewatch"
description = "Security alerts for Lightning nodes: checks your node against published advisories"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["lightning", "bitcoin", "security", "lnd", "core-lightning"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
# data/ is git-ignored but must ship: scripts/package-data.sh fills it with the
# advisories, release table and dashboard before publishing.
include = ["src/**", "build.rs", "data/**", "Cargo.toml"]

[[bin]]
name = "firewatch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap.workspace = true
firewatch-alerts.workspace = true
firewatch-connectors.workspace = true
firewatch-core.workspace = true
futures.workspace = true
reqwest = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
