[package]
name = "firewatch-connectors"
description = "Read-only node connectors for Firewatch"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lightning", "bitcoin", "security", "lnd", "core-lightning"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
futures.workspace = true
firewatch-core.workspace = true
# Already compiled in through reqwest; named here only to classify its errors.
hyper = { version = "1", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
