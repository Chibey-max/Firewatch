<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Firewatch: is your Lightning node affected by a published security advisory?" />
    <title>Firewatch</title>
    <script>
      // Apply the saved or requested theme before first paint (light is the default).
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('fw-theme')
        if (t === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
